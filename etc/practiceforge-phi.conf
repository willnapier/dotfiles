# PHI-bearing application log rotation (created 2026-07-29).
#
# These four sinks carry special-category health data — chiefly TM3 clinical
# DOCUMENT TITLES, which embed client names — written by the application
# itself with no assistant in the loop. They are durable and never transit the
# DPA path, so they must be size-bounded and must not accumulate archives.
#
# History was purged to zero on 2026-07-29 (8.7 MB / 130,223 lines on
# tm3-diary-live.stderr alone) once the extract_day_columns root-cause fix had
# run clean for five weeks, retiring the forensic argument for keeping it.
# Rotation exists so that purge is not a one-off: without it the leak simply
# re-accumulates at ~1,200 lines/day.
#
# owner:group is REQUIRED — see gmpull.conf. newsyslog runs as root but these
# agents run as uid 501, so a root-owned replacement file silently breaks
# logging. This bit was learned the hard way; do not drop the column.
#
# mode 600, NOT 644: these were world-readable until 2026-07-29. gmpull.conf
# uses 644 because its log carries no PHI. These do.
#
# count 0 and NO Z flag are deliberate. gmpull keeps 7 gzipped archives; doing
# that here would mean seven compressed copies of patient data sitting on disk
# permanently. Rotation here DELETES rather than archives.
#
# Rotate when >2 MB, keep zero archives, size-triggered only (when=*).
#
# logfilename                                                            owner:group          mode count size  when  flags
/Users/williamnapier/.local/share/tm3-diary-live.stderr                  williamnapier:staff  600   0     2048  *     -
/Users/williamnapier/.local/share/tm3-diary-live.stdout                  williamnapier:staff  600   0     2048  *     -
/Users/williamnapier/.local/share/practiceforge/dashboard-stderr.log     williamnapier:staff  600   0     2048  *     -
/Users/williamnapier/.local/share/practiceforge/dashboard-stdout.log     williamnapier:staff  600   0     2048  *     -
