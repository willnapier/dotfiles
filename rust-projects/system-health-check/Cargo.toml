[package]
name = "system-health-check"
version = "0.3.5"
edition = "2021"
description = "Daily system health validator: dead timers/agents, failed services, stale dotfiles, missing Rust binaries, DNA drift, dotter drift, orphaned headless Chrome. systemd on Linux, launchd on macOS."

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
