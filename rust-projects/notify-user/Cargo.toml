[package]
name = "notify-user"
version = "0.1.0"
edition = "2021"
description = "One delivery path for unattended desktop alerts: tries the platform notifier, records every attempt and its outcome to ~/.local/state/alerts/<tool>.jsonl, exits 1 when nothing was delivered."

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
