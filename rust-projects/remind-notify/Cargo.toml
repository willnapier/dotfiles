[package]
name = "remind-notify"
version = "0.1.0"
edition = "2021"
description = "Every-minute reminder notifier for today's DayPage reminder file: timed `(at HH:MM)` items fire when due, date-only items fire once; Finder dialog on macOS, notify-send on Linux. A failed notification is retried next minute and recorded in the outcome heartbeat."

[dependencies]
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
