[package]
name = "rust-redeploy"
version = "0.1.0"
edition = "2021"
description = "Rebuild and redeploy the rust-projects that cross-machine-sync-check reports as stale"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
sha2 = "0.10"
