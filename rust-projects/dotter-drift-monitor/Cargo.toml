[package]
name = "dotter-drift-monitor"
version = "0.2.0"
edition = "2021"
description = "Stateless deployed-vs-intended check for Dotter: reads global.toml every run, compares with disk, exits 0/1/2"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
globset = "0.4"
