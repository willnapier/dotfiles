[package]
name = "messageboard-edit"
version = "0.2.0"
edition = "2021"
description = "Atomic Messageboard editing with one writer per file: each host appends to its own MESSAGEBOARD.<host>.md, foreign sections are retired by tombstone, readers see the merged view."

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
chrono = "0.4"
sha2 = "0.10"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
