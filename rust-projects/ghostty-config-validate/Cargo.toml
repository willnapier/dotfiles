[package]
name = "ghostty-config-validate"
version = "0.2.0"
edition = "2021"
description = "After a Ghostty app update (launchd WatchPaths): heal the Application Support config symlink and validate ~/.config/ghostty/config with `ghostty +show-config`; dialog + exit 1 when broken. Rust port of the bash script, 2026-09-23."

[dependencies]
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
serde_json = "1"
logkeep = { path = "../logkeep" }

[dev-dependencies]
tempfile = "3"
