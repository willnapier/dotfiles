[package]
name = "syncthing-sync-watchdog"
version = "0.2.0"
edition = "2021"
description = "Proves Mac→nimbini Syncthing propagation every 5 minutes: writes a heartbeat into ~/Forge and polls nimbini for it; a stall is a recorded, notified finding (exit 0); a heartbeat that cannot be written is a failure (exit 1)."

[dependencies]
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
serde_json = "1"
logkeep = { path = "../logkeep" }

[dev-dependencies]
tempfile = "3"
