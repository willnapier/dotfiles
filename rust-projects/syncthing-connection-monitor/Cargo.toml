[package]
name = "syncthing-connection-monitor"
version = "0.1.0"
edition = "2021"
description = "Polls the local Syncthing REST API and restarts the local daemon only when its API is unreachable; offline peers are logged, never restarted for. One binary for macOS (launchd) and Linux (systemd)."

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = "0.4"
serde_json = "1"
ureq = { version = "2", default-features = false }

[dev-dependencies]
tempfile = "3"
