[package]
name = "icalc"
version = "0.1.0"
edition = "2021"
description = "IronCalc-backed CLI: read, recalculate, what-if and check xlsx models; knows Will's House Model and its live sources (practiceforge/Xero, fd-budget)"

[[bin]]
name = "icalc"
path = "src/main.rs"

[dependencies]
ironcalc = "0.8.3"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
toml = "0.8"
