[package]
name = "zotero-watcher"
version = "0.1.0"
edition = "2021"
description = "Zotero import watchers in one binary: `pdf` (event-driven ZoteroImport -> ProcessedPDFs) and `bridge` (polling Dropbox ZoteroImport -> Documents ZoteroImport). Rust port of zotero-pdf-watcher-renu and zotero-bridge-renu."

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = "0.4"
notify = "6"
forge-names = { path = "../forge-names" }

[dev-dependencies]
tempfile = "3"
