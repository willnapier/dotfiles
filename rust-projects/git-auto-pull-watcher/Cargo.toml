[package]
name = "git-auto-pull-watcher"
version = "0.2.0"
edition = "2021"
description = "Fast-forwards Git-transported repositories (by default ~/dotfiles, then `dotter deploy`) every tick, never merging or rebasing, with a heartbeat JSON for monitors."

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
