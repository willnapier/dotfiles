[package]
name = "git-auto-pull-watcher"
version = "0.1.0"
edition = "2021"
description = "Fast-forwards ~/dotfiles (then `dotter deploy`) and ~/Assistants from origin/main every tick, never merging or rebasing, with a heartbeat JSON for monitors. One binary for macOS (launchd) and Linux (systemd); replaces three Nushell scripts."

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
