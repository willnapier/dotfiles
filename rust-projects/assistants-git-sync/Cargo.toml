[package]
name = "assistants-git-sync"
version = "0.1.0"
edition = "2021"
description = "Single-historian Git coordination for the Syncthing-transported Assistants tree."

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
filetime = "0.2"
