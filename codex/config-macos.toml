# Codex CLI — macOS variant (dotter [macos.files] → ~/.codex/config.toml).
# The Linux variant is codex/config.toml. They differ in absolute paths; keep
# model, reasoning effort, and permission defaults in step by hand.
# Codex writes runtime state into this file (the [notice] and [tui.*] tables), so
# those tables change on their own and are committed by the auto-push watcher —
# the same accepted pattern as Claude's settings.json.
model = "gpt-5.6-sol"
model_reasoning_effort = "max"

# Continuum owns the off-PATH CLI; update it with `continuum codex update`.
check_for_update_on_startup = false

# William explicitly authorises autonomous engineering work by default.
# Task scope and destructive-action safeguards still come from AGENTS.md.
approval_policy = "never"
sandbox_mode = "danger-full-access"

# Search is available; keep it cached by default, switch to live only when needed
web_search = "cached"
approvals_reviewer = "user"

[projects."/Users/williamnapier"]
trust_level = "trusted"

[notice]
"hide_full_access_warning" = true
"hide_gpt-5.3-codex_migration_prompt" = true

[mcp_servers.continuum]
command = "/Users/williamnapier/.local/bin/continuum-mcp-quiet"

[mcp_servers.continuum.env]
CONTINUUM_DIR = "/Users/williamnapier/Assistants/continuum-logs"

[tui.model_availability_nux]
"gpt-5.6-sol" = 4
