# nimbini-photos — the photograph archive.
#
# Connection details are injected by ~/.local/state/rustic-backup/secrets/
# nimbini-photos.env. The repository password is a separate 0600 file.
# This file is safe to commit: it contains no credentials or endpoint.
#
# Deliberately absent: [forget] and prune. Every snapshot is retained forever,
# and that is load-bearing twice over — it is the standing retention decision
# for nimbini-general, AND it is what makes later curation safe: once a corpus
# is here, deleting from the working library is reversible, so photographs can
# be culled hard without risk. See PHOTO-ARCHIVE-STRATEGY.md 11.5.
#
# SCOPE: Corpus B (Dropbox photo tree), Corpus D (Flickr export), and Corpus C
# (Google Takeout, unpacked). Corpus A (iCloud export) lives in THIS same
# repository via the mac-photos profile, so rustic can deduplicate
# byte-identical material across corpora; it cannot do that between
# repositories. See PHOTO-ARCHIVE-STRATEGY.md 11.6.
#
# NOT HERE: /home/will/Dropbox/Clinical (59 G) is PHI and belongs in
# nimbini-clinical behind its own DPA/DPIA and key-custody gates. That is the
# ONLY clinical exclusion — ClinVid was briefly mis-flagged and is included
# below; it is teaching video, confirmed by the controller.

[global]
no-progress = true
log-level = "info"

[repository]
repository = "opendal:sftp"

[repository.options]
# Stay below the Storage Box SSH-session ceiling during parallel pack checks.
connections = "4"

[backup]
exclude-if-present = ["CACHEDIR.TAG"]

# --- Corpus B: the Dropbox photo tree -------------------------------------
# Flickr is the flickr-export stanza below. iCloud is the mac-photos profile
# against this same repository.

[[backup.snapshots]]
name = "camera-uploads"
sources = ["/home/will/Dropbox/Camera uploads"]

[[backup.snapshots]]
name = "old-movies"
sources = ["/home/will/Dropbox/OldMovies"]

[[backup.snapshots]]
name = "rose"
sources = ["/home/will/Dropbox/Rose", "/home/will/Dropbox/16 years of Rose"]

[[backup.snapshots]]
name = "dropbox-old"
sources = ["/home/will/Dropbox/Dropbox (Old)"]

[[backup.snapshots]]
name = "clinvid"
sources = ["/home/will/Dropbox/ClinVid"]

[[backup.snapshots]]
name = "misc-photos"
sources = [
    "/home/will/Dropbox/Art Stuff",
    "/home/will/Dropbox/TheForgeEthernetPhotos",
    "/home/will/Dropbox/My Pictures",
    "/home/will/Dropbox/Screenshots",
]

# --- Corpus D: the Flickr official export ---------------------------------
# 201.45 GB / 45,259 media files + 45,276 metadata sidecars, unpacked from the
# 97 official-export ZIPs. Uniquely holds 2013-2016 and everything pre-2012:
# no other corpus has that material at all.
#
# The UNPACKED tree is the backup source, not ~/FlickrExportZips. Per-file
# restore, cross-corpus dedup, and the sidecars stay readable; a ZIP is one
# opaque blob that has to come down whole to yield one photograph.
#
# Gate at 2026-09-01: flickr-fetch verify reports 45,259/45,260, zero
# zero-length. The one absentee, id 16228399711, is a 2015 video that Flickr
# ITSELF cannot serve - its url_o in the survey manifest is Flickr's own
# video-failure/k.png placeholder, and the export shipped the sidecar with no
# media. Exactly 1 of 45,260 items carries that placeholder and the other 266
# videos exported cleanly, so this is a broken source item, not an export
# defect. Do NOT gap-fill it: that downloads a 9 KB error PNG and turns the
# gate green over a corrupt file. See PHOTO-ARCHIVE-STRATEGY.md 12.6.
[[backup.snapshots]]
name = "flickr-export"
sources = ["/home/will/FlickrExport"]

# --- Corpus C: Google Photos via Takeout ---------------------------------
# Unpacked from Drive takeout-20260902T235002Z (42 zip parts + one oversized
# MOV that exceeded the 2 GiB split). Uniquely holds 2017, which exists in
# no other corpus. Album folders may duplicate items — hash pass later.
#
# The UNPACKED tree is the backup source, not ~/GoogleTakeoutArchives.
# Pre-upload 2026-09-03: 39,667 files / 93,619,351,314 bytes (87.19 GiB);
# 22,505 media; Photos from 2017 = 2,481 media / 9,173,639,545 bytes.
# Integrity: unzip -t 43/43; IMG_5033.MOV placed next to its 2024 sidecar.
# See PHOTO-ARCHIVE-STRATEGY.md 15.3.
[[backup.snapshots]]
name = "google-takeout"
sources = ["/home/will/GoogleTakeout"]

# --- Canonical PhotoForge archive and its transition evidence -------------
# Keep both survey generations and the operator dry-run beside the published
# archive so the decoder/inventory transition can be re-audited after loss of
# the working source trees. The dry-run remains outside sealed archive identity.
[[backup.snapshots]]
name = "photoforge-canonical-archive-20260904"
sources = [
    "/home/will/PhotoArchive",
    "/home/will/PhotoSurveys/four-corpus-signature-v2-20260904",
    "/home/will/PhotoSurveys/four-corpus-prefix-v3-20260904",
    "/home/will/.local/state/photoforge/four-corpus-prefix-inventory-dry-run-20260904.json",
]
